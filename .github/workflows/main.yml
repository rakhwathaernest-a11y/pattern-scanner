name: Update Football Pattern Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install requests
      - name: Test football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://api.football-data.org/v4/competitions/PL/matches"
          headers = {"X-Auth-Token": os.environ["FOOTBALL_DATA_TOKEN"]}
          params = {"season": "2026"}

          r = requests.get(url, headers=headers, params=params, timeout=30)

          print("HTTP STATUS:", r.status_code)
          print(r.text[:2000])

          r.raise_for_status()

          data = r.json()
          print("MATCHES FOUND:", len(data.get("matches", [])))
          print("SEASON:", data.get("season"))
          PY
      - name: Run scanner
        env:
  
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}        
        run: |
          python scripts/update_data.py

      - name: Save scanner results
        run: |
          git config user.name "Pattern Scanner"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update football pattern data"
          git push
