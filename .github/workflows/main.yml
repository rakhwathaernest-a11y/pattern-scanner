name: Update Football Pattern Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install requests
      - name: Run scanner
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}        
        run: |
          python scripts/update_data.py

      - name: Save scanner results
        run: |
          git config user.name "Pattern Scanner"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update football pattern data"
          git push
